<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEarthyOchre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F523E"/>
      <stop offset="50%" stop-color="#3A3C2D"/>
      <stop offset="100%" stop-color="#24261B"/>
    </linearGradient>
    <linearGradient id="skinEbony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A241A"/>
      <stop offset="50%" stop-color="#28170F"/>
      <stop offset="100%" stop-color="#190D08"/>
    </linearGradient>
    <linearGradient id="goldSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB927"/>
      <stop offset="50%" stop-color="#E58B12"/>
      <stop offset="100%" stop-color="#C25A0B"/>
    </linearGradient>
    <pattern id="royalSunburst" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#E58B12"/>
      <!-- Deep Terracotta & Maroon Geometric Rectangles -->
      <rect x="0" y="0" width="40" height="40" fill="#8C2D19"/>
      <rect x="40" y="40" width="40" height="40" fill="#5E1914"/>
      <!-- Sunburst & Medallion Concentric Circles -->
      <circle cx="20" cy="20" r="14" fill="none" stroke="#FDB927" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#FDB927" stroke-width="2"/>
      <circle cx="20" cy="20" r="3" fill="#FAF7F0"/>
      <!-- Sun rays -->
      <line x1="20" y1="2" x2="20" y2="8" stroke="#FDB927" stroke-width="2"/>
      <line x1="20" y1="32" x2="20" y2="38" stroke="#FDB927" stroke-width="2"/>
      <line x1="2" y1="20" x2="8" y2="20" stroke="#FDB927" stroke-width="2"/>
      <line x1="32" y1="20" x2="38" y2="20" stroke="#FDB927" stroke-width="2"/>
      <!-- Chevron & Diamond Patterns -->
      <polygon points="60,5 75,20 60,35 45,20" fill="#FDB927"/>
      <polygon points="60,10 70,20 60,30 50,20" fill="#5E1914"/>
      <!-- Hatching Lines -->
      <line x1="45" y1="50" x2="75" y2="50" stroke="#FAF7F0" stroke-width="1.8"/>
      <line x1="45" y1="60" x2="75" y2="60" stroke="#FAF7F0" stroke-width="1.8"/>
      <line x1="45" y1="70" x2="75" y2="70" stroke="#FAF7F0" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- Earthy Studio Background -->
  <rect width="600" height="800" fill="url(#bgEarthyOchre)"/>
  <!-- Tiled Earthy Ground -->
  <line x1="0" y1="740" x2="600" y2="740" stroke="#1A1C14" stroke-width="2"/>
  <ellipse cx="300" cy="745" rx="160" ry="20" fill="#12130D" opacity="0.5"/>

  <!-- Exposed Statuesque Ebony Leg (High Slit) -->
  <path d="M290,430 Q270,580 280,720 L310,720 Q315,580 320,430 Z" fill="url(#skinEbony)"/>
  <!-- Bare Foot with Graceful Arches -->
  <path d="M280,720 Q275,735 295,745 L315,745 Q315,735 310,720 Z" fill="url(#skinEbony)"/>

  <!-- Flowing Royal Golden Boubou Kaftan Silhouette -->
  <path d="M200,210 L80,380 L140,740 L460,740 L520,380 L400,210 Z" fill="url(#goldSilk)"/>
  <path d="M200,210 L80,380 L140,740 L460,740 L520,380 L400,210 Z" fill="url(#royalSunburst)" opacity="0.92"/>

  <!-- Dramatic Center Front Slit Opening -->
  <path d="M285,420 L275,740 L340,740 L325,420 Z" fill="#4A140F"/>

  <!-- Wide Antique Brown Leather Waist Cinch Belt -->
  <rect x="235" y="375" width="130" height="45" rx="4" fill="#3D1D12" stroke="#251009" stroke-width="2"/>
  <!-- Antique Cast Brass Medallion Buckle -->
  <rect x="280" y="380" width="40" height="35" rx="6" fill="#C5A059" stroke="#8C6E30" stroke-width="2"/>
  <circle cx="300" cy="397" r="10" fill="none" stroke="#5E4315" stroke-width="2"/>
  <circle cx="300" cy="397" r="4" fill="#5E4315"/>

  <!-- Wide Golden Kimono Cuffs & Embroidered Borders -->
  <polygon points="80,380 140,460 165,440 105,360" fill="#FDB927" stroke="#8C2D19" stroke-width="2"/>
  <polygon points="520,380 460,460 435,440 495,360" fill="#FDB927" stroke="#8C2D19" stroke-width="2"/>

  <!-- Hands on Hips Confident Royal Pose -->
  <path d="M240,390 Q225,385 220,395 Q235,405 245,400" fill="url(#skinEbony)"/>
  <path d="M360,390 Q375,385 380,395 Q365,405 355,400" fill="url(#skinEbony)"/>

  <!-- Plunging V-Neckline with Embroidered Border -->
  <path d="M255,210 L300,375 L345,210 Z" fill="url(#skinEbony)"/>
  <!-- Ornate Golden Neck Border Placket -->
  <path d="M255,210 L300,375 L305,375 L265,210 Z" fill="#FDB927" stroke="#5E1914" stroke-width="1.5"/>
  <path d="M345,210 L300,375 L295,375 L335,210 Z" fill="#FDB927" stroke="#5E1914" stroke-width="1.5"/>

  <!-- High Layered Royal Gold Neck Choker -->
  <g fill="#FDB927" stroke="#9A7828" stroke-width="1.2">
    <rect x="282" y="195" width="36" height="5" rx="2"/>
    <rect x="280" y="202" width="40" height="5" rx="2"/>
    <rect x="278" y="209" width="44" height="5" rx="2"/>
    <rect x="276" y="216" width="48" height="5" rx="2"/>
  </g>

  <!-- Head & Regal Facial Symmetry -->
  <ellipse cx="300" cy="150" rx="32" ry="40" fill="url(#skinEbony)"/>

  <!-- Majestic Tall Multi-Tiered Pleated Golden Gele (Crown) -->
  <path d="M240,140 C210,50 390,50 360,140 C385,90 380,40 330,20 C270,10 230,40 240,140 Z" fill="#E58B12"/>
  <path d="M240,140 C210,50 390,50 360,140 C385,90 380,40 330,20 C270,10 230,40 240,140 Z" fill="url(#royalSunburst)"/>
  <!-- Circular Pleat Ribbons -->
  <path d="M235,110 Q300,75 365,110" fill="none" stroke="#FDB927" stroke-width="3.5"/>
  <path d="M245,75 Q300,45 355,75" fill="none" stroke="#FDB927" stroke-width="3.5"/>
  <circle cx="300" cy="30" r="14" fill="#FDB927" stroke="#8C2D19" stroke-width="2"/>

  <!-- Gold Drop Circular Medallion Earrings -->
  <circle cx="260" cy="165" r="5" fill="#FDB927"/>
  <circle cx="340" cy="165" r="5" fill="#FDB927"/>

  <!-- Regal Sculpted Features -->
  <ellipse cx="288" cy="144" rx="4.5" ry="3" fill="#0C0704"/>
  <ellipse cx="312" cy="144" rx="4.5" ry="3" fill="#0C0704"/>
  <!-- High Cheekbone Glow -->
  <ellipse cx="278" cy="152" rx="6" ry="3" fill="#5C3B2C" opacity="0.6"/>
  <ellipse cx="322" cy="152" rx="6" ry="3" fill="#5C3B2C" opacity="0.6"/>
  <!-- Warm Brown Lips with Gold Center Tint -->
  <ellipse cx="300" cy="168" rx="10" ry="5" fill="#4A1E17"/>
  <ellipse cx="300" cy="167" rx="4" ry="2" fill="#FDB927" opacity="0.5"/>

  <!-- Editorial Signature Tag -->
  <g transform="translate(40, 750)">
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="16" letter-spacing="4" fill="#FDB927" font-weight="600" text-transform="uppercase">The Royal Golden Boubou</text>
    <text y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" fill="#E6D3A3" text-transform="uppercase">Marigold Sunburst Silk Kaftan with Sculpted Leather Cinch</text>
  </g>
</svg>
